<title>Dam Candidate Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e6;
    --paper-raised:#efe8d8;
    --ink:#1c2b28;
    --ink-soft:#4b5a55;
    --line:rgba(28,43,40,.15);
    --river:#1f6f6b;
    --river-soft:#1f6f6b1a;
    --terrain:#a86a2c;
    --confirmed:#3d7a4f;
    --confirmed-soft:#3d7a4f1a;
    --uncertain:#b3791f;
    --uncertain-soft:#b3791f1a;
    --stopped:#a13d33;
    --stopped-soft:#a13d331a;
    --shadow: 0 1px 2px rgba(28,43,40,.06), 0 10px 26px rgba(28,43,40,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111c1a; --paper-raised:#16231f; --ink:#eef2ef; --ink-soft:#a9b8b2;
      --line:rgba(238,242,239,.14); --river:#5cc2ba; --river-soft:#5cc2ba22;
      --terrain:#d99a4e; --confirmed:#6fbf83; --confirmed-soft:#6fbf8322;
      --uncertain:#e0a53d; --uncertain-soft:#e0a53d22; --stopped:#e0776a; --stopped-soft:#e0776a22;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#111c1a; --paper-raised:#16231f; --ink:#eef2ef; --ink-soft:#a9b8b2;
    --line:rgba(238,242,239,.14); --river:#5cc2ba; --river-soft:#5cc2ba22;
    --terrain:#d99a4e; --confirmed:#6fbf83; --confirmed-soft:#6fbf8322;
    --uncertain:#e0a53d; --uncertain-soft:#e0a53d22; --stopped:#e0776a; --stopped-soft:#e0776a22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Work Sans',system-ui,-apple-system,sans-serif;
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  h1{font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0;}

  /* ---- Top bar ---- */
  header{
    display:flex; align-items:center; gap:18px;
    padding:14px 22px; border-bottom:2px solid var(--ink);
    flex-wrap:wrap;
  }
  header h1{font-size:19px; white-space:nowrap;}
  .progress-track{
    flex:1; min-width:160px; height:8px; border-radius:4px;
    background:var(--line); overflow:hidden; display:flex;
  }
  .progress-track div{height:100%;}
  .progress-label{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}
  .tallies{display:flex; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:12px; white-space:nowrap;}
  .tallies span{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .filters{display:flex; gap:6px;}
  .filter-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.03em;
    padding:5px 10px; border-radius:100px; border:1px solid var(--line);
    background:none; color:var(--ink-soft); cursor:pointer;
  }
  .filter-btn.active{background:var(--river); border-color:var(--river); color:var(--paper);}

  /* ---- Main stage ---- */
  main{
    flex:1; display:flex; align-items:center; justify-content:center;
    gap:40px; padding:20px; min-height:0;
  }
  .stage{display:flex; gap:36px; align-items:center; max-width:920px; width:100%;}
  .imgwrap{
    flex:none; width:min(46vh,420px); height:min(46vh,420px);
    border-radius:14px; overflow:hidden; border:1px solid var(--line);
    box-shadow:var(--shadow); background:var(--paper-raised);
    position:relative;
  }
  .imgwrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .imgwrap .navhint{
    position:absolute; bottom:10px; left:10px; right:10px;
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6);
    opacity:.85; pointer-events:none;
  }
  .details{flex:1; min-width:0;}
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em;
    text-transform:uppercase; padding:3px 9px; border-radius:100px; display:inline-block;
  }
  .chip.confirmed{background:var(--confirmed-soft); color:var(--confirmed);}
  .chip.uncertain{background:var(--uncertain-soft); color:var(--uncertain);}
  .details .metarow{
    display:flex; gap:16px; margin:12px 0 20px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft);
  }
  .details .metarow b{color:var(--ink); font-weight:500;}
  .details .candid{font-size:22px; margin-bottom:2px;}
  .actions{display:flex; flex-direction:column; gap:10px;}
  .actbtn{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper-raised); cursor:pointer; font-family:'Work Sans',sans-serif;
    font-size:15px; font-weight:500; color:var(--ink); transition:transform .06s;
  }
  .actbtn:active{transform:scale(.98);}
  .actbtn .key{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:5px; padding:2px 7px;
  }
  .actbtn.yes{border-color:var(--confirmed);}
  .actbtn.yes:hover{background:var(--confirmed-soft);}
  .actbtn.no{border-color:var(--stopped);}
  .actbtn.no:hover{background:var(--stopped-soft);}
  .actbtn.unsure{border-color:var(--uncertain);}
  .actbtn.unsure:hover{background:var(--uncertain-soft);}
  .actbtn.current-label{outline:2px solid currentColor; outline-offset:1px;}

  .jumpnav{display:flex; gap:8px; margin-top:22px;}
  .navbtn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:7px 12px;
    border-radius:8px; border:1px solid var(--line); background:none; color:var(--ink-soft); cursor:pointer;
  }
  .navbtn:hover{color:var(--ink); border-color:var(--ink-soft);}

  .done-screen{
    display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  }
  .done-screen h2{font-family:'Fraunces',serif; font-size:26px; margin:0;}
  .done-screen p{color:var(--ink-soft); max-width:44ch;}

  footer{
    padding:8px 22px; border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
    display:flex; justify-content:space-between;
  }

  @media (max-width:720px){
    .stage{flex-direction:column;}
    .imgwrap{width:min(60vw,320px); height:min(60vw,320px);}
  }
</style>

<header>
  <h1>Dam Candidate Review</h1>
  <div class="progress-track" id="progressTrack"></div>
  <div class="progress-label" id="progressLabel">0 / 0</div>
  <div class="tallies">
    <span><span class="dot" style="background:var(--confirmed)"></span><span id="tallyYes">0</span></span>
    <span><span class="dot" style="background:var(--stopped)"></span><span id="tallyNo">0</span></span>
    <span><span class="dot" style="background:var(--uncertain)"></span><span id="tallyUnsure">0</span></span>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-f="unreviewed">Unreviewed</button>
    <button class="filter-btn" data-f="new-confirmed">Confirmed</button>
    <button class="filter-btn" data-f="new-uncertain">Uncertain</button>
    <button class="filter-btn" data-f="all">All</button>
  </div>
</header>

<main id="main"></main>

<footer>
  <span>Guadalquivir Basin Pilot — candidate confirmation, PNOA 0.5m imagery</span>
  <span id="idLabel" class="mono"></span>
</footer>

// Raw file order clusters geographically (this batch happened to put
// every new-confirmed candidate first, 13/62 of which sit in the known
// Doñana river-mapping gap where the pipeline mistakes open coastline
// for water candidates) -- a deterministic shuffle breaks that up so
// review order is a fair sample instead of a run of the worst cases.
function seededShuffle(arr, seed) {
  const a = arr.slice();
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const SHUFFLED_CANDIDATES = seededShuffle(CANDIDATES, 20260916);

let labels = {};     // candidate_id -> {status, ts}
let order = [];       // ids in current filter's display order
let filter = 'unreviewed';
let cursor = 0;
let db = null;

const byId = Object.fromEntries(CANDIDATES.map(c => [c.candidate_id, c]));

function computeOrder() {
  let ids = SHUFFLED_CANDIDATES.map(c => c.candidate_id);
  if (filter === 'unreviewed') ids = ids.filter(id => !labels[id]);
  else if (filter !== 'all') ids = ids.filter(id => byId[id].match_status === filter);
  order = ids;
  cursor = 0;
}

function tallies() {
  const t = {yes:0, no:0, unsure:0};
  for (const id in labels) {
    const s = labels[id].status;
    if (s === 'yes') t.yes++;
    else if (s === 'no') t.no++;
    else if (s === 'unsure') t.unsure++;
  }
  return t;
}

function renderHeader() {
  const total = CANDIDATES.length;
  const reviewed = Object.keys(labels).length;
  document.getElementById('progressLabel').textContent = `${reviewed} / ${total}`;
  const pct = total ? (reviewed/total*100) : 0;
  document.getElementById('progressTrack').innerHTML =
    `<div style="width:${pct}%; background:var(--river);"></div>`;
  const t = tallies();
  document.getElementById('tallyYes').textContent = t.yes;
  document.getElementById('tallyNo').textContent = t.no;
  document.getElementById('tallyUnsure').textContent = t.unsure;
}

function renderCard() {
  const main = document.getElementById('main');
  document.getElementById('idLabel').textContent = '';
  if (order.length === 0) {
    main.innerHTML = `<div class="done-screen">
      <h2>Nothing left in this view</h2>
      <p>Switch filters above, or come back once more candidates are added to the review batch.</p>
    </div>`;
    return;
  }
  if (cursor >= order.length) cursor = order.length - 1;
  const id = order[cursor];
  const c = byId[id];
  const label = labels[id];
  const statusClass = c.match_status === 'new-confirmed' ? 'confirmed' : 'uncertain';
  const statusText = c.match_status === 'new-confirmed' ? 'New-confirmed' : 'New-uncertain';
  // Known failure mode (found 2026-09-16): candidates west of -6.2deg sit
  // in a river-mapping gap near the Doñana coast where the pipeline has
  // mistaken open coastline for a water candidate -- flagging it here
  // rather than leaving it a silent mystery in the image.
  const likelyOpenWater = c.lon < -6.2 || c.confidence >= 0.999;

  main.innerHTML = `
    <div class="stage">
      <div class="imgwrap">
        <img src="${id}.jpg" alt="PNOA crop for ${id}" loading="eager">
        <div class="navhint"><span>${cursor+1} / ${order.length} in view</span><span>${id}</span></div>
      </div>
      <div class="details">
        <div class="candid mono">${c.lat.toFixed(5)}, ${c.lon.toFixed(5)}</div>
        <div class="chip ${statusClass}">${statusText}</div>
        ${likelyOpenWater ? '<div class="chip" style="background:var(--stopped-soft);color:var(--stopped);margin-left:6px;">⚠ possible open-water/coastal false positive</div>' : ''}
        <div class="metarow">
          <span>confidence <b>${c.confidence.toFixed(3)}</b></span>
        </div>
        <div class="actions">
          <button class="actbtn yes ${label?.status==='yes'?'current-label':''}" data-action="yes">Real dam / barrier <span class="key">Y</span></button>
          <button class="actbtn no ${label?.status==='no'?'current-label':''}" data-action="no">Not a dam <span class="key">N</span></button>
          <button class="actbtn unsure ${label?.status==='unsure'?'current-label':''}" data-action="unsure">Can't tell <span class="key">U</span></button>
        </div>
        <div class="jumpnav">
          <button class="navbtn" id="prevBtn">&larr; back</button>
          <button class="navbtn" id="skipBtn">skip &rarr;</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('idLabel').textContent = id;
  main.querySelectorAll('.actbtn').forEach(btn => {
    btn.addEventListener('click', () => label_candidate(id, btn.dataset.action));
  });
  document.getElementById('prevBtn').addEventListener('click', () => { if (cursor>0){cursor--; renderCard();} });
  document.getElementById('skipBtn').addEventListener('click', () => advance());
}

function advance() {
  // Re-derive the order (an unreviewed item just labeled should drop out of that view)
  const wasFilter = filter;
  computeOrder();
  filter = wasFilter;
  if (order.length === 0) { renderCard(); return; }
  cursor = Math.min(cursor, order.length - 1);
  renderCard();
}

async function label_candidate(id, status) {
  labels[id] = {status, ts: Date.now()};
  renderHeader();
  if (db) {
    try {
      await db.collection('labels').doc(id).set({status, ts: Date.now()});
    } catch (e) { /* keep local state even if the write fails */ }
  }
  if (filter === 'unreviewed') {
    // stays in place; item drops from the unreviewed list
    computeOrder();
    renderCard();
  } else {
    advance();
  }
}

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter = btn.dataset.f;
  computeOrder();
  renderCard();
});

document.addEventListener('keydown', (e) => {
  if (order.length === 0) return;
  const id = order[cursor];
  if (e.key === 'y' || e.key === 'Y') label_candidate(id, 'yes');
  else if (e.key === 'n' || e.key === 'N') label_candidate(id, 'no');
  else if (e.key === 'u' || e.key === 'U') label_candidate(id, 'unsure');
  else if (e.key === 'ArrowLeft') { if (cursor>0){cursor--; renderCard();} }
  else if (e.key === 'ArrowRight') advance();
});

async function init() {
  try {
    db = await claude.use('db');
  } catch (e) { db = null; }
  if (db) {
    try {
      const snap = await db.collection('labels').get();
      snap.docs.forEach(d => { labels[d.id] = d.data(); });
    } catch (e) { /* start empty */ }
  }
  computeOrder();
  renderHeader();
  renderCard();
}
init();
</script>
